[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/host",
    "crates/client",
    "crates/relay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ForgeLink Contributors"]
description = "Game-quality remote play from an Apple Silicon Mac to a Windows PC"
repository = "https://github.com/forgelink/forgelink"
homepage = "https://github.com/forgelink/forgelink"
readme = "README.md"

[workspace.dependencies]
forgelink-core = { path = "crates/core", version = "0.1.0" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bytes = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.8"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
data-encoding = "2"
socket2 = { version = "0.5", features = ["all"] }
local-ip-address = "0.6"
directories = "5"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
eframe = { version = "0.31", default-features = true }
egui = "0.31"
openh264 = "0.6"
cpal = "0.15"
gilrs = "0.11"
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
once_cell = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
