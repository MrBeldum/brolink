[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/host",
    "crates/client",
    "crates/ui",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["BroLink Contributors"]
description = "Your Windows PC on your Mac: Sunshine + Moonlight over Tailscale, with wake and sleep"
repository = "https://github.com/MrBeldum/brolink"
homepage = "https://github.com/MrBeldum/brolink"
readme = "README.md"

[workspace.dependencies]
brolink-core = { path = "crates/core", version = "2.0.0" }
brolink-ui = { path = "crates/ui", version = "2.0.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.8"
directories = "5"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.31", default-features = true }
egui = "0.31"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
