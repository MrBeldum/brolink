name: release

# Two ways in:
#   * workflow_dispatch -- build binaries to download from the run page.
#   * a v* tag -- same binaries, published as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Never ship a binary whose tests were not run.
      - name: test
        run: cargo test -p brolink-core -p brolink-client
      - name: build client
        run: cargo build --release -p brolink-client --target aarch64-apple-darwin
      # bundle-macos.sh ad-hoc signs and verifies the bundle itself.
      - name: bundle
        run: bash scripts/bundle-macos.sh
      - name: package
        run: |
          cp docs/MACOS.md dist/README-MACOS.md
          cd dist && tar czf brolink-macos-arm64.tar.gz BroLink.app README-MACOS.md
      - uses: actions/upload-artifact@v4
        with:
          name: brolink-macos-arm64
          path: dist/brolink-macos-arm64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --release -p brolink-host
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\brolink-host.exe dist\
          Copy-Item docs\WINDOWS.md dist\README-WINDOWS.md
          Copy-Item scripts\install-host.ps1 dist\
          Compress-Archive -Path dist\* -DestinationPath brolink-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: brolink-windows-x64
          path: brolink-windows-x64.zip
          if-no-files-found: error

  publish:
    # Tags only: a manual run just leaves artifacts on the run page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) PRE=--prerelease ;;
            *)   PRE= ;;
          esac
          cat > notes.md <<'EOF'
          ## BroLink 2.0

          BroLink is now a thin layer over three tools that already do the
          hard part well: **Sunshine** streams the PC, **Moonlight** shows it
          on the Mac with hardware HEVC/AV1 decode, and **Tailscale** connects
          the two from anywhere. BroLink adds what they leave out: waking the
          PC from the Mac, putting it back to sleep, pairing without touching
          the PC, and one click to get from "asleep in another room" to a full
          screen desktop.

          The custom protocol, encoder, decoder, relay, UPnP, STUN, tickets,
          and PIN dialogs from 1.x are gone.

          ## Install

          **Windows PC**: unzip, run `brolink-host.exe`, click **Set up this
          PC** once (one administrator prompt: installs Sunshine, opens the
          control port to your tailnet, arms Wake-on-LAN). Sign the PC in to
          Tailscale with your account. Or run `install-host.ps1` to get
          shortcuts and start-at-logon.

          **Mac (Apple Silicon)**: either

          ```bash
          curl -fsSL https://raw.githubusercontent.com/MrBeldum/brolink/main/scripts/install-macos-release.sh | bash
          ```

          or download the tarball and

          ```bash
          tar xzf brolink-macos-arm64.tar.gz
          xattr -dr com.apple.quarantine BroLink.app
          open BroLink.app
          ```

          The `xattr` step is needed for a browser download because the app
          is ad-hoc signed, not Developer-ID signed. The app installs
          Moonlight for you and lists the PCs on your Tailscale account.

          ## What is verified

          - Unit tests, clippy and fmt on Windows and macOS in CI
          - The host service on a real Windows 11 PC with Tailscale: status on
            loopback and on the tailnet address, 403 for a LAN address,
            request validation, `tailscale whois` identity check
          - The elevated setup script's text (a test pins its quoting); the
            Wake-on-LAN probe against a real adapter
          - Every screen of both apps rendered to PNG and reviewed

          ## What is not

          - A full Mac-to-PC session through this build (wake, auto-pair,
            Moonlight launch) has not been watched end to end on a Mac
          - The silent Sunshine install and `--creds` step ran only as far as
            the UAC prompt on the maintainer's machine (the build machine is
            not elevated); the script is straightforward but treat the first
            run as a test and read the setup log if the card stays orange
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BroLink ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            $PRE \
            artifacts/*/*
