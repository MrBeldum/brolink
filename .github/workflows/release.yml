name: release

# Two ways in:
#   * workflow_dispatch: build the binaries and leave them on the run page.
#   * a v* tag: the same binaries, published as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # The Sunshine installer shipped inside the Windows zip. Bump on purpose:
  # the host's PIN hand-off is tested against this release.
  SUNSHINE_VERSION: v2026.516.143833

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Never ship a binary whose tests were not run.
      - name: test
        run: cargo test -p brolink-core -p brolink-stream -p brolink-client
      - name: build client
        run: cargo build --release -p brolink-client --target aarch64-apple-darwin
      # bundle-macos.sh ad-hoc signs and verifies the bundle itself.
      - name: bundle
        run: bash scripts/bundle-macos.sh
      - name: package
        run: |
          cp docs/MACOS.md dist/README-MACOS.md
          cp LICENSE NOTICE dist/
          cd dist && tar czf brolink-macos-arm64.tar.gz BroLink.app README-MACOS.md LICENSE NOTICE
      - uses: actions/upload-artifact@v4
        with:
          name: brolink-macos-arm64
          path: dist/brolink-macos-arm64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --release -p brolink-host
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\brolink-host.exe dist\
          Copy-Item docs\WINDOWS.md dist\README-WINDOWS.md
          Copy-Item scripts\install-host.ps1, LICENSE, NOTICE dist\
          Invoke-WebRequest "https://github.com/LizardByte/Sunshine/releases/download/$env:SUNSHINE_VERSION/Sunshine-Windows-AMD64-installer.msi" -OutFile dist\Sunshine-Windows-AMD64-installer.msi
          Compress-Archive -Path dist\* -DestinationPath brolink-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: brolink-windows-x64
          path: brolink-windows-x64.zip
          if-no-files-found: error

  publish:
    # Tags only: a manual run just leaves artifacts on the run page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout first: it empties the workspace, so artifacts downloaded
      # before it would be deleted.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: release notes
        # The CHANGELOG.md section whose heading is this version, up to
        # the next heading. A tag without one gets GitHub's generated notes.
        run: |
          awk -v want="${GITHUB_REF_NAME#v}" '
            /^## / { on = ($2 == want); next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            echo "NOTES=--notes-file notes.md" >> "$GITHUB_ENV"
          else
            echo "no CHANGELOG.md section for ${GITHUB_REF_NAME}; using generated notes"
            echo "NOTES=--generate-notes" >> "$GITHUB_ENV"
          fi
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) PRE=--prerelease ;;
            *)   PRE= ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BroLink ${GITHUB_REF_NAME}" \
            $NOTES \
            $PRE \
            artifacts/*/*
