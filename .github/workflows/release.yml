name: release

# Two ways in:
#   * workflow_dispatch: build the binaries and leave them on the run page.
#   * a v* tag: the same binaries, published as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # The engine archive shipped inside the Windows zip. Must match
  # crates/host/src/setup.rs ENGINE_* — the windows job checks before download.
  # Exact AMD64-lite filename: this tag also publishes ARM64-lite.zip.
  ENGINE_TAG: v2026.906.222525
  ENGINE_SHA256: 50f4123dd15a6817513589c912581260c34cc4a58e9a5f3071ebac3d92c94c15
  ENGINE_ZIP: Sunshine-Windows-AMD64-lite.zip

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Never ship a binary whose tests were not run.
      - name: test
        run: cargo test -p brolink-core -p brolink-stream -p brolink-client -p brolink-host
      - name: build app
        run: cargo build --release -p brolink-host --target aarch64-apple-darwin
      # bundle-macos.sh ad-hoc signs and verifies the bundle itself.
      - name: bundle
        run: bash scripts/bundle-macos.sh
      - name: package
        run: |
          cp docs/MACOS.md dist/README-MACOS.md
          cp LICENSE NOTICE dist/
          cd dist && tar czf brolink-macos-arm64.tar.gz BroLink.app README-MACOS.md LICENSE NOTICE
      - uses: actions/upload-artifact@v4
        with:
          name: brolink-macos-arm64
          path: dist/brolink-macos-arm64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --release -p brolink-host
      - name: pin matches setup.rs
        shell: pwsh
        run: |
          $src = Get-Content crates/host/src/setup.rs -Raw
          function Const([string]$name) {
            $m = [regex]::Match($src, "pub const ${name}: &str = `"([^`"]+)`"")
            if (-not $m.Success) { throw "setup.rs missing $name" }
            $m.Groups[1].Value
          }
          foreach ($k in @('ENGINE_ZIP','ENGINE_TAG','ENGINE_SHA256')) {
            $got = Const $k
            $want = [Environment]::GetEnvironmentVariable($k)
            if ($got -ne $want) { throw "$k drift: setup.rs=$got workflow=$want" }
          }
          Write-Host "ENGINE_ZIP/TAG/SHA256 match setup.rs"
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\brolink-host.exe dist\
          Copy-Item docs\WINDOWS.md dist\README-WINDOWS.md
          Copy-Item scripts\install-host.ps1, LICENSE, NOTICE dist\
          $zip = Join-Path dist $env:ENGINE_ZIP
          $url = "https://github.com/LizardByte/Sunshine/releases/download/$($env:ENGINE_TAG)/$($env:ENGINE_ZIP)"
          curl.exe -sSL -A brolink -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw "downloading $url failed (curl exit $LASTEXITCODE)" }
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          if ($got -ne $env:ENGINE_SHA256) {
            throw "engine archive is not $($env:ENGINE_TAG): expected $($env:ENGINE_SHA256), got $got"
          }
          Compress-Archive -Path dist\* -DestinationPath brolink-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: brolink-windows-x64
          path: brolink-windows-x64.zip
          if-no-files-found: error

  publish:
    # Tags only: a manual run just leaves artifacts on the run page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout first: it empties the workspace, so artifacts downloaded
      # before it would be deleted.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: release notes
        # The CHANGELOG.md section whose heading is this version, up to
        # the next heading. A tag without one gets GitHub's generated notes.
        run: |
          awk -v want="${GITHUB_REF_NAME#v}" '
            /^## / { on = ($2 == want); next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            echo "NOTES=--notes-file notes.md" >> "$GITHUB_ENV"
          else
            echo "no CHANGELOG.md section for ${GITHUB_REF_NAME}; using generated notes"
            echo "NOTES=--generate-notes" >> "$GITHUB_ENV"
          fi
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) PRE=--prerelease ;;
            *)   PRE= ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BroLink ${GITHUB_REF_NAME}" \
            $NOTES \
            $PRE \
            artifacts/*/*
