name: release

# Two ways in:
#   * workflow_dispatch -- build binaries to download from the run page. This
#     is how you get a Mac client for a smoke test without cutting a release.
#   * a v* tag -- same binaries, published as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Never ship a binary whose tests were not run.
      - name: test
        run: cargo test -p forgelink-core -p forgelink-client
      - name: build client
        run: cargo build --release -p forgelink-client --target aarch64-apple-darwin
      - name: bundle
        run: bash scripts/bundle-macos.sh
      # Apple Silicon refuses to run an unsigned binary outright. The linker
      # ad-hoc signs the executable, but copying it into a bundle leaves the
      # bundle itself unsigned, so sign the whole thing here.
      - name: ad-hoc sign
        run: |
          codesign --force --deep --sign - dist/ForgeLink.app
          codesign --verify --deep --strict --verbose=2 dist/ForgeLink.app
      - name: package
        run: |
          cp docs/MACOS.md dist/README-MACOS.md
          cd dist && tar czf forgelink-macos-arm64.tar.gz ForgeLink.app README-MACOS.md
      - uses: actions/upload-artifact@v4
        with:
          name: forgelink-macos-arm64
          path: dist/forgelink-macos-arm64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --release --workspace
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\forgelink-host.exe dist\
          Copy-Item target\release\forgelink-client.exe dist\
          Copy-Item target\release\forgelink-relay.exe dist\
          Copy-Item docs\WINDOWS.md dist\README-WINDOWS.md
          Copy-Item scripts\install-host.ps1 dist\
          Compress-Archive -Path dist\* -DestinationPath forgelink-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: forgelink-windows-x64
          path: forgelink-windows-x64.zip
          if-no-files-found: error

  publish:
    # Tags only: a manual run just leaves artifacts on the run page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ForgeLink ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*/*
