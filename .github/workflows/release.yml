name: release

# Two ways in:
#   * workflow_dispatch -- build binaries to download from the run page. This
#     is how you get a Mac client for a smoke test without cutting a release.
#   * a v* tag -- same binaries, published as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Never ship a binary whose tests were not run.
      - name: test
        run: cargo test -p brolink-core -p brolink-client
      - name: build client
        run: cargo build --release -p brolink-client --target aarch64-apple-darwin
      # bundle-macos.sh ad-hoc signs and verifies the bundle itself.
      - name: bundle
        run: bash scripts/bundle-macos.sh
      - name: package
        run: |
          cp docs/MACOS.md dist/README-MACOS.md
          cd dist && tar czf brolink-macos-arm64.tar.gz BroLink.app README-MACOS.md
      - uses: actions/upload-artifact@v4
        with:
          name: brolink-macos-arm64
          path: dist/brolink-macos-arm64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --release --workspace
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\brolink-host.exe dist\
          Copy-Item target\release\brolink-client.exe dist\
          Copy-Item target\release\brolink-relay.exe dist\
          Copy-Item docs\WINDOWS.md dist\README-WINDOWS.md
          Copy-Item scripts\install-host.ps1 dist\
          Compress-Archive -Path dist\* -DestinationPath brolink-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: brolink-windows-x64
          path: brolink-windows-x64.zip
          if-no-files-found: error

  publish:
    # Tags only: a manual run just leaves artifacts on the run page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A semver prerelease (v0.1.0-alpha.1) is marked as one, so GitHub
          # does not present it as the latest stable build.
          case "${GITHUB_REF_NAME}" in
            *-*) PRE=--prerelease ;;
            *)   PRE= ;;
          esac
          cat > notes.md <<'EOF'
          ## Install

          **macOS (Apple Silicon)**

          ```bash
          tar xzf brolink-macos-arm64.tar.gz
          xattr -dr com.apple.quarantine BroLink.app
          RUST_LOG=info BroLink.app/Contents/MacOS/BroLink
          ```

          The `xattr` step is required. The bundle is ad-hoc signed rather than
          Developer ID signed, so Gatekeeper reports it as damaged without it.

          **Windows (host)**

          Unzip, then run `brolink-host.exe` (or `install-host.ps1`). FFmpeg
          is downloaded on first run if it is not found. If clients cannot
          connect, run `fix-firewall.ps1` from an elevated PowerShell --
          Windows block rules override allow rules and are the usual cause.

          ## New in 1.2

          Fixes for everything reported from the Mac:

          - Colour: the stream is pinned to limited-range BT.601, which is what
            the client decodes. Desktop Duplication hands FFmpeg a full-range
            frame and the old filter chain passed that through, so the picture
            decoded over-bright and warm.
          - No letterboxing: a non-16:9 desktop is encoded at its own aspect
            ratio instead of being padded into a 16:9 box. This also fixes
            absolute mouse positioning, which mapped the bars as desktop.
          - The mouse is released whenever the window loses focus, so Cmd-Tab
            always frees it. The hint says fn+F8 on macOS, where F8 is a media
            key.
          - Audio on the Mac: the client prefers the device's own sample format
            and falls back to its default configuration if 48 kHz will not open.
          - Both windows redesigned on one shared theme (crates/ui, Inter).
          - Docs: why Gatekeeper calls the app damaged and how to sign it, and
            running a relay when the router cannot open a port.

          ## What is verified

          - 242 unit tests, clippy clean, on Windows and macOS in CI
          - End-to-end loopback on one Windows machine (h264_amf) with the new
            filter chain: capture, encode, encrypt, fragment, send, reassemble,
            decrypt, decode, plus audio checked for real signal rather than
            digital silence
          - The colour fix against a real Desktop Duplication frame: the old
            chain produced full-range NV12 (white at Y=255), the new one
            limited range (Y=235) whatever the capture frame is tagged
          - The Mac client opens CoreAudio at 48 kHz F32 and plays every frame
            (ignored test, run on the maintainer's Mac)
          - Every screen of both UIs rendered to PNG and reviewed

          ## What is not

          - A Mac-to-Windows streaming session with these fixes has not been
            watched end to end; colour, aspect ratio and focus-release are
            verified by construction and on Windows, not yet by eye on the Mac
          - Waking over the internet depends on the NIC keeping ARP offload on
            during sleep and on the router honouring a permanent mapping; both
            are common, neither is universal
          - The rendezvous and relay are unit-tested, not soak-tested
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BroLink ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            $PRE \
            artifacts/*/*
