name: release

# Two ways in:
#   * workflow_dispatch: build the binaries and leave them on the run page.
#   * a v* tag: the same binaries, published as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # The Sunshine installer shipped inside the Windows zip. Bump on purpose:
  # the host's PIN hand-off is tested against this release.
  SUNSHINE_VERSION: v2026.516.143833

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Never ship a binary whose tests were not run.
      - name: test
        run: cargo test -p brolink-core -p brolink-stream -p brolink-client
      - name: build client
        run: cargo build --release -p brolink-client --target aarch64-apple-darwin
      # bundle-macos.sh ad-hoc signs and verifies the bundle itself.
      - name: bundle
        run: bash scripts/bundle-macos.sh
      - name: package
        run: |
          cp docs/MACOS.md dist/README-MACOS.md
          cp LICENSE NOTICE dist/
          cd dist && tar czf brolink-macos-arm64.tar.gz BroLink.app README-MACOS.md LICENSE NOTICE
      - uses: actions/upload-artifact@v4
        with:
          name: brolink-macos-arm64
          path: dist/brolink-macos-arm64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --release -p brolink-host
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\brolink-host.exe dist\
          Copy-Item docs\WINDOWS.md dist\README-WINDOWS.md
          Copy-Item scripts\install-host.ps1, LICENSE, NOTICE dist\
          Invoke-WebRequest "https://github.com/LizardByte/Sunshine/releases/download/$env:SUNSHINE_VERSION/Sunshine-Windows-AMD64-installer.msi" -OutFile dist\Sunshine-Windows-AMD64-installer.msi
          Compress-Archive -Path dist\* -DestinationPath brolink-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: brolink-windows-x64
          path: brolink-windows-x64.zip
          if-no-files-found: error

  publish:
    # Tags only: a manual run just leaves artifacts on the run page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) PRE=--prerelease ;;
            *)   PRE= ;;
          esac
          cat > notes.md <<'EOF'
          ## BroLink 3.0

          The Mac app streams by itself. Moonlight's GameStream client
          library (moonlight-common-c) is compiled into BroLink, frames are
          decoded with VideoToolbox and drawn in BroLink's own window. There
          is no Moonlight to install. The Windows zip carries the Sunshine
          installer, so the PC downloads nothing during setup either.

          - A toolbar above the picture instead of a bare video: PC name and
            stream details, mouse capture (Ctrl+Alt), what the Command key
            does, a Keys menu (Ctrl+Alt+Del, Windows key, Alt+Tab, Esc,
            Print Screen), stats, full screen, the PC's power menu, and
            Disconnect. In full screen the toolbar sits in the letterbox bar
            when there is one and drops down from the top edge when there is
            not.
          - Waking: setup turns Fast Startup off and writes the driver
            keywords for magic-packet wake from sleep, modern standby and
            shutdown. The host listens on UDP 9 while awake, and the PC menu
            on the Mac has **Test wake**, which says whether wake packets
            from where you are reach the PC at all.
          - Pairing talks to both Sunshine's current PIN API and the next
            one (pairing ids).
          - License: GPL-3.0-or-later, as moonlight-common-c requires.

          ## Install

          **Windows PC**: unzip, run `brolink-host.exe` (or `install-host.ps1`
          for shortcuts and start-at-logon), click **Set up this PC** once.
          Sign the PC in to Tailscale with your account.

          **Mac (Apple Silicon)**: with the GitHub CLI signed in,

          ```bash
          curl -fsSL https://raw.githubusercontent.com/MrBeldum/brolink/main/scripts/install-macos-release.sh | bash
          ```

          or download the tarball and

          ```bash
          tar xzf brolink-macos-arm64.tar.gz
          xattr -dr com.apple.quarantine BroLink.app
          open BroLink.app
          ```

          ## Verified

          - Unit tests, clippy and fmt on Windows and macOS in CI
          - On a Windows 11 PC with Sunshine v2026.516: pairing through the
            built-in client (all five phases, pinned certificate), app list,
            launch and resume, an encrypted RTSP session with decoded video,
            a clean stop, and the live picture rendered in the BroLink
            window
          - The host service on the same PC: status, the wake-packet
            listener receiving a real magic packet, the Mac-side wake test
            against it
          - Every screen of both apps rendered to PNG and reviewed

          ## Not verified

          - The app on an actual Mac: macOS CI builds it, and the
            VideoToolbox decoder is written against Apple's documented API,
            but nobody has run this build on Apple hardware yet
          - The elevated setup script end to end: the development PC already
            had Sunshine, the firewall rules and Wake-on-LAN in place
          - Wake from a full shutdown depends on the board's firmware
            allowing it; the Test wake result covers the network path only
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BroLink ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            $PRE \
            artifacts/*/*
