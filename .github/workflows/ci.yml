name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: release build
        run: cargo build --workspace --release

  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy -p brolink-core -p brolink-stream -p brolink-client -p brolink-host --all-targets -- -D warnings
      - name: test
        run: cargo test -p brolink-core -p brolink-stream -p brolink-client -p brolink-host
      - name: release app
        run: cargo build --release -p brolink-host --target aarch64-apple-darwin
      - name: bundle
        run: bash scripts/bundle-macos.sh

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: native deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang pkg-config libssl-dev
      - name: clippy
        run: cargo clippy -p brolink-core -p brolink-stream -p brolink-client -p brolink-host --all-targets -- -D warnings
      - name: test
        run: cargo test -p brolink-core -p brolink-stream -p brolink-client -p brolink-host
      - name: release host
        run: cargo build --release -p brolink-host

  deploy-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: node kit selftest
        run: bash deploy/node/selftest.sh
      - name: relay kit selftest
        run: bash deploy/relay/selftest.sh
