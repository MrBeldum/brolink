name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: release build
        run: cargo build --workspace --release

  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy -p brolink-core -p brolink-stream -p brolink-client --all-targets -- -D warnings
      - name: test
        run: cargo test -p brolink-core -p brolink-stream -p brolink-client
      - name: release client
        run: cargo build --release -p brolink-client --target aarch64-apple-darwin
      - name: bundle
        run: bash scripts/bundle-macos.sh

  relay-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: relay installer selftest
        run: bash deploy/relay/selftest.sh
