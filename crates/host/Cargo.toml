[package]
name = "brolink-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "BroLink Host: sets up Sunshine on this PC and lets a Mac wake, pair with, and power it"
build = "build.rs"

[[bin]]
name = "brolink-host"
path = "src/main.rs"

[dependencies]
brolink-core.workspace = true
brolink-ui.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
clap.workspace = true
semver = "1"
eframe.workspace = true
egui.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
toml.workspace = true
# Renders the screens to PNGs without a display, so the UI can be reviewed
# from any machine. See the `snapshots` test module in app.rs.
egui_kittest = { version = "0.31", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
