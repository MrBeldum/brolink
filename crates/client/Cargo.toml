[package]
name = "latch-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Latch: view and share machines on your tailnet"

[lib]
name = "latch_client"
path = "src/lib.rs"

[[bin]]
name = "latch-client"
path = "src/main.rs"

[dependencies]
latch-core.workspace = true
latch-stream.workspace = true
latch-ui.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
semver = "1"

[dev-dependencies]
toml.workspace = true
egui_kittest = { version = "0.31", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
